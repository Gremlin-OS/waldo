name: ci

# Files that neither build nor test reads do not start a run. PROTOCOL.md
# is not in the list: the tests check the code against it.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - README.md
      - DESIGN.md
      - TODO.md
      - CHANGELOG.md
      - LICENSE-*
      - soak/**
      - vendor/libghostty-vt/README.md
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Every commit
# on main keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This installer leaves the Nix store writable by the runner, which
      # the cache below needs in order to restore into it.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # Keeps the emulator library, which takes five minutes to build,
      # between runs. The store is garbage-collected before it is saved, so
      # only what the link made below points to is kept; the toolchains
      # come from the public Nix cache each time, which is quick.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'vendor/libghostty-vt/SHA256SUMS') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          gc-max-store-size-linux: 500M
      - run: nix build .#libghostty-vt --out-link .vt-root
      # Builds the package, runs the unit and integration tests, and runs
      # clippy with warnings as errors. The same command works locally.
      - run: nix flake check -L

  # The build without Nix, as README.md describes it. Keeps a tarball.
  plain:
    uses: ./.github/workflows/build.yml
