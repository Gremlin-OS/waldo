name: ci

# Files that neither build nor test reads do not start a run. PROTOCOL.md
# is not in the list: the tests check the code against it.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - README.md
      - DESIGN.md
      - TODO.md
      - CHANGELOG.md
      - LICENSE-*
      - soak/**
      - vendor/libghostty-vt/README.md
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Every commit
# on main keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # This installer leaves the Nix store writable by the runner, which
      # the cache below needs in order to restore into it.
      - uses: nixbuild/nix-quick-install-action@v30
      # Keeps the Nix store between runs, so the emulator library and the
      # Rust toolchain are not built or fetched again until the flake or
      # the vendored tarballs change.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'vendor/libghostty-vt/SHA256SUMS') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      # Builds the package, runs the unit and integration tests, and runs
      # clippy with warnings as errors. The same command works locally.
      - run: nix flake check -L

  # The build without Nix, as README.md describes it. Keeps a tarball.
  plain:
    uses: ./.github/workflows/build.yml
